<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Neural Swarm">
  <!-- App icon: a swarm of agent nodes on a dark field. Kept geometric so it
       stays legible at 48px, and padded so maskable crops do not clip it. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#07090c" />
  <rect width="512" height="512" fill="url(#glow)" />

  <g stroke="url(#edge)" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M256 132 L370 198 L370 314 L256 380 L142 314 L142 198 Z" />
    <path d="M256 132 L256 380" opacity="0.45" />
    <path d="M142 198 L370 314" opacity="0.45" />
    <path d="M370 198 L142 314" opacity="0.45" />
  </g>

  <g fill="#0b0f14" stroke="#10b981" stroke-width="7">
    <circle cx="256" cy="132" r="30" />
    <circle cx="370" cy="198" r="24" />
    <circle cx="370" cy="314" r="24" />
    <circle cx="256" cy="380" r="30" />
    <circle cx="142" cy="314" r="24" />
    <circle cx="142" cy="198" r="24" />
  </g>

  <circle cx="256" cy="256" r="52" fill="#10b981" />
  <circle cx="256" cy="256" r="20" fill="#04120c" />
</svg>
