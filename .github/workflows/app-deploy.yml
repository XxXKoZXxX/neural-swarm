name: Deploy app

# Publishes mobile/ to the Neural Swarm Vercel project at /app/, giving the phone
# a permanent HTTPS URL to install from — Android will not offer the install
# prompt without one.
#
# The app is deployed as a prebuilt artifact alongside the website, so the exact
# bundle that passed the tests is what ships, and the site keeps working at /.
# Uses the same VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID_* secrets that
# the existing site deploy already proves out, so no new project is required.

on:
  push:
    branches: [main, arena/01a0da12-neural-swarm]
    paths:
      - 'mobile/**'
      - '.github/workflows/app-deploy.yml'
  pull_request:
    paths:
      - 'mobile/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: app-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: Logic tests (adapters, error mapping, planner, diff)
        run: npm test

      - name: Integration tests (mounts the real app)
        run: npm run test:ui

      - name: Build
        run: npm run build

      - name: Check it is installable
        run: |
          node -e "
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('dist/manifest.webmanifest', 'utf8'));
          const sizes = m.icons.map(i => i.sizes);
          const checks = [
            ['name', !!m.name],
            ['short_name', !!m.short_name],
            ['start_url', !!m.start_url],
            ['display standalone', m.display === 'standalone'],
            ['192px icon', sizes.includes('192x192')],
            ['512px icon', sizes.includes('512x512')],
            ['maskable icon', m.icons.some(i => i.purpose === 'maskable')],
            ['service worker', fs.existsSync('dist/sw.js')],
          ];
          let bad = 0;
          for (const [label, pass] of checks) {
            console.log((pass ? '  ok   ' : '  FAIL ') + label);
            if (!pass) bad++;
          }
          if (bad) { console.error('\nNot installable.'); process.exit(1); }
          console.log('\nInstallable.');
          "

  publish:
    name: Publish to /app/
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Build the website
        run: |
          npm ci
          npm run build

      - name: Build the app for the /app/ subpath
        working-directory: mobile
        run: |
          npm ci
          APP_BASE=/app/ npm run build

      - name: Assemble one deployable tree
        run: |
          mkdir -p dist/app
          cp -r mobile/dist/. dist/app/
          cp dist/index.html dist/404.html
          cp dist/app/index.html dist/app/404.html
          echo "--- dist/app ---"
          ls dist/app
          echo "--- size ---"
          du -sh dist

      - name: Publish (prebuilt, so nothing is rebuilt remotely)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_NEURAL_SWARM }}
        run: |
          set -o pipefail
          npx --yes vercel@latest build --prod --yes --token="$VERCEL_TOKEN" 2>&1 | tee /tmp/build.log
          npx --yes vercel@latest deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" 2>&1 | tee /tmp/deploy.log

          url=$(grep -Eo 'https://[a-z0-9.-]+\.vercel\.app' /tmp/deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "## Neural Swarm app published"
            echo ""
            echo "**Install URL:** ${url:-https://neural-swarm.vercel.app}/app/"
            echo ""
            echo "On the phone: open that URL in Chrome, then menu (top right) -> **Install app**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report the failure on the PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "App publish failed on \`${{ github.sha }}\`."
            echo
            echo '```'
            tail -40 /tmp/build.log /tmp/deploy.log 2>/dev/null || echo "no log captured"
            echo '```'
          } > /tmp/comment.md
          pr=$(gh pr list --head "${{ github.ref_name }}" --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --body-file /tmp/comment.md
          else
            echo "No PR for this branch; dumping log instead."
            cat /tmp/comment.md
          fi
